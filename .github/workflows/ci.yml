name: CI

on:
  push:
  pull_request:
  workflow_call:  # the deploy workflow runs these checks first

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the package version comes from git history (hatch-vcs)
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0; reads .python-version
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
      # The real corpus as a golden: reads the three tags from github.com (no Databricks) and fails if any
      # chunk-determined column changed without a CLEANER_VERSION/CHUNKER_VERSION bump. About a minute.
      - run: uv run python scripts/corpus_fingerprint.py
