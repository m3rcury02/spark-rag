[project]
name = "docs-rag"
dynamic = ["version"]  # from git (hatch-vcs): every commit builds a distinct wheel version
description = "Incremental RAG ingestion pipeline over the Apache Spark docs, with a retrieval eval harness"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "tokenizers==0.23.3",  # WordPiece counts in the embedding models' units (docs_rag.tokens)
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling", "hatch-vcs==0.5.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# Serverless caches a custom package by version, so new code needs a new version (D-005). With no tags yet,
# setuptools-scm gives 0.0.1.devN+g<sha>. The fallback covers checkouts without git metadata.
raw-options = { fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/docs_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::SyntaxWarning"]  # e.g. an invalid escape in a docstring fails the suite

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "BLE", "SIM"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E501", "F821", "E402", "I001"]

[tool.mypy]
strict = true
files = ["src"]
